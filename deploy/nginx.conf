server {
  listen      80;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # No content hashes in any filename, so aggressive caching would serve a
  # stale stylesheet after a deploy. nginx already sends ETag and
  # Last-Modified; let revalidation do the work and keep the window short.
  location ~* \.(css|js|png|svg|pdf)$ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }

  gzip              on;
  gzip_min_length   1024;
  gzip_types        text/css application/javascript image/svg+xml application/xml text/plain;

  # The PDF and PNGs are already compressed; re-gzipping them just burns CPU.
  gzip_proxied      no-store no-cache private expired auth;
}
