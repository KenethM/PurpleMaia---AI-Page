<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#1a002d"/>
  <!-- Purple Maiʻa mark: inverted triangle on a 4-row triangular lattice.
       Only the downward cells are filled; the purple ground shows through
       the upward ones, which is what gives the mark its woven look. -->
  <g fill="#ffffff">
    <path d="M5 7h5.5L7.75 11.75Z"/><path d="M10.5 7H16l-2.75 4.75Z"/>
    <path d="M16 7h5.5l-2.75 4.75Z"/><path d="M21.5 7H27l-2.75 4.75Z"/>
    <path d="M7.75 11.75h5.5L10.5 16.5Z"/><path d="M13.25 11.75h5.5L16 16.5Z"/>
    <path d="M18.75 11.75h5.5L21.5 16.5Z"/>
    <path d="M10.5 16.5H16l-2.75 4.75Z"/><path d="M16 16.5h5.5l-2.75 4.75Z"/>
    <path d="M13.25 21.25h5.5L16 26Z"/>
  </g>
</svg>
